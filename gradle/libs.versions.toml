[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
room = "2.8.5"
junit = "4.13.2"
androidxTestCore = "1.7.0"
